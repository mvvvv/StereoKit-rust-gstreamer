[package]
name = "screencast"
version = "0.1.0"
authors = ["© mv81 https://github.com/mvvvv"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.79"
publish = false

[dependencies]
# XDG Desktop Portal via ashpd
ashpd = { version = "0.12", features = ["tokio"] }

# UI framework
eframe = { version = "0.33", features = [
    "default",
    "__screenshot",
] }
egui_extras = { version = "0.33", features = ["default", "image"] }

# GStreamer
gstreamer = { version = "0.24" }
gstreamer-rtsp = { version = "0.24" }
gstreamer-rtsp-server = { version = "0.24" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Utilities
anyhow = { version = "1.0" }
dirs = "6.0"
log = { version = "0.4" }
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
futures = "0.3.31"
